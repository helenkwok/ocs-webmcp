<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCS WebMCP</title>
<meta name="description" content="Open CAD Studio's DWG/DXF editor, exposed to AI agents over WebMCP. Read tools are free; every write waits for a human." />
<style>
  :root {
    --bg: #16181c; --panel: #1f2227; --line: #2e333a; --text: #e6e8eb; --muted: #9aa3ad;
    --ok: #4cc38a; --bad: #ef6b6b; --accent: #4f8cff; --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header strong { font-size: 14px; }
  [data-ocs-status] { color: var(--muted); }
  [data-ocs-status][data-ok="false"] { color: var(--bad); }
  header a { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; margin: 0; padding: 10px 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  [data-ocs-activity] { list-style: none; margin: 0; padding: 6px 0; overflow: auto; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
  [data-ocs-activity] li { padding: 3px 12px; border-left: 3px solid transparent; word-break: break-word; }
  [data-ocs-activity] li[data-phase="ok"] { border-color: var(--ok); }
  [data-ocs-activity] li[data-phase="error"], [data-ocs-activity] li[data-phase="declined"] { border-color: var(--bad); }
  [data-ocs-activity] li[data-phase="approved"] { border-color: var(--accent); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0; width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog header { border: 0; padding: 14px 16px 0; display: block; }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }
  dialog p { margin: 0; color: var(--warn); }
  dialog pre { margin: 12px 16px; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button[data-ocs-approve] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 30vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <strong>OCS WebMCP</strong>
  <span data-ocs-status data-ok="true">Starting…</span>
  <a href="NOTICE.md">Licences &amp; source</a>
</header>
<main>
  <!-- Upstream Open CAD Studio, built unmodified from a pinned commit, same origin. -->
  <iframe id="ocs" src="ocs/" title="Open CAD Studio"></iframe>
  <aside>
    <h2>Agent activity</h2>
    <ul data-ocs-activity></ul>
  </aside>
</main>

<dialog data-ocs-confirm>
  <header>
    <h3 data-ocs-confirm-title></h3>
    <p>An agent wants to change the drawing. Nothing happens unless you approve.</p>
  </header>
  <pre><span data-ocs-confirm-tool></span>
<span data-ocs-confirm-args></span></pre>
  <footer>
    <button data-ocs-decline>Decline</button>
    <button data-ocs-approve>Approve</button>
  </footer>
</dialog>

<script type="module" src="src/shell.js"></script>
</body>
</html>
